<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التطبيق الجغرافي التفاعلي</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    
    /* شريط التنقل */
    nav { background: #2c3e50; padding: 10px; color: white; display: flex; gap: 10px; }
    nav button { background: #34495e; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
    nav button.active { background: #27ae60; }
    
    /* التحكم في ظهور التبويبات */
    .tab-content { display: none; padding: 20px; }
    .tab-content.active { display: block; }
    
    /* حظر التبويبات للمستخدمين غير المسجلين */
    .protected-tab { display: none !important; }
    .logged-in .protected-tab { display: none; } /* سيتم إظهارها حسب التبويب النشط فقط */
    .logged-in .protected-tab.active { display: block !important; }

    /* حاوية الخريطة */
    #map { width: 100%; height: 500px; border-radius: 8px; margin-top: 10px; }
    .form-box { max-width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- شريط التنقل -->
  <nav id="navbar">
    <button onclick="switchTab('login-tab')" id="btn-login" class="active">تسجيل الدخول</button>
    <button onclick="switchTab('map-tab')" id="btn-map" class="protected-tab">الخريطة التفاعلية</button>
    <button onclick="switchTab('analytics-tab')" id="btn-analytics" class="protected-tab">التحليلات والتصنيف</button>
  </nav>

  <!-- 1. تبويب تسجيل الدخول (يظهر أولاً) -->
  <div id="login-tab" class="tab-content active">
    <div class="form-box">
      <h3>تسجيل الدخول</h3>
      <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:100%; margin-bottom:10px; padding:8px;"><br>
      <input type="password" id="password" placeholder="كلمة المرور" style="width:100%; margin-bottom:10px; padding:8px;"><br>
      <button onclick="handleLogin()" style="width:100%; padding:10px; background:#27ae60; color:white; border:none; cursor:pointer;">دخول</button>
    </div>
  </div>

  <!-- 2. تبويب الخريطة (محمي) -->
  <div id="map-tab" class="tab-content protected-tab">
    <h2>الخريطة التفاعلية</h2>
    <div id="map"></div>
  </div>

  <!-- 3. تبويب التحليلات (محمي) -->
  <div id="analytics-tab" class="tab-content protected-tab">
    <h2>نتائج التحليل والتصنيف</h2>
    <p>هنا تظهر بيانات وتفاصيل نتائج التقييم والتصنيف بعد تسجيل الدخول.</p>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = null;
    let isLoggedIn = false;

    // تسجيل الدخول والإظهار الشرطي للتبويبات
    function handleLogin() {
      // تعيين حالة الدخول
      isLoggedIn = true;
      document.body.classList.add('logged-in');

      // إخفاء تبويب تسجيل الدخول والزر الخاص به
      document.getElementById('login-tab').classList.remove('active');
      document.getElementById('btn-login').style.display = 'none';

      // التوجيه مباشرة لتبويب الخريطة
      switchTab('map-tab');
    }

    // التنقل بين التبويبات بشكل مستقل
    function switchTab(tabId) {
      // التأكد من عدم إمكانية فتح التبويبات المحمية دون تسجيل الدخول
      if (!isLoggedIn && tabId !== 'login-tab') {
        alert('يرجى تسجيل الدخول أولاً للوصول لهذا التبويب.');
        return;
      }

      // إخفاء جميع التبويبات وإلغاء تنشيط الأزرار
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      // إظهار التبويب المطلوب فقط
      document.getElementById(tabId).classList.add('active');
      
      // تفعيل الزر المطابق
      const activeBtnMap = {
        'login-tab': 'btn-login',
        'map-tab': 'btn-map',
        'analytics-tab': 'btn-analytics'
      };
      if (activeBtnMap[tabId]) {
        document.getElementById(activeBtnMap[tabId]).classList.add('active');
      }

      // إعادة تهيئة وتحديث حجم الخريطة عند فتح تبويب الخريطة
      if (tabId === 'map-tab') {
        initMap();
        setTimeout(() => {
          if (map) map.invalidateSize(); // إصلاح مشكلة عدم تحميل أجزاء من الخريطة
        }, 200);
      }
    }

    // تهيئة الخريطة مع طبقات OSM و ESRI Imagery
    function initMap() {
      if (map !== null) return; // منع إعادة التهيئة المتكررة

      // 1. طبقة OpenStreetMap
      const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      });

      // 2. طبقة ESRI World Imagery (صور الأقمار الصناعية)
      const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      });

      // إنشاء الخريطة وإضافة الطبقة الافتراضية
      map = L.map('map', {
        center: [30.0444, 31.2357], // إحداثيات القاهرة كمثال
        zoom: 6,
        layers: [osmLayer]
      });

      // قائمة التحكم بالطبقات (Layer Control)
      const baseMaps = {
        "خريطة الشارع المفتوحة (OpenStreetMap)": osmLayer,
        "الصور الفضائية (Esri Imagery)": satelliteLayer
      };

      L.control.layers(baseMaps).addTo(map);
    }
  </script>
</body>
</html>
